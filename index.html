<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Institut Quran & Arabe</title>
<style>
  body { font-family: 'Poppins', sans-serif; background:#f5f2e9; color:#8B4513; padding: 1rem; }
  .courses-grid {
    display: grid; grid-template-columns: repeat(auto-fit,minmax(300px,1fr));
    gap: 1rem;
  }
  .course-card {
    background: white; padding: 1rem; border-radius: 12px;
    box-shadow: 0 10px 30px rgba(139,69,19,.15);
  }
</style>
</head>
<body>

<h1>Nos Cours</h1>
<div class="courses-grid"></div>

<script>
async function loadCourses() {
  try {
    const res = await fetch('http://localhost:3001/api/courses');
    const courses = await res.json();
    const container = document.querySelector('.courses-grid');
    container.innerHTML = courses.map(c => `
      <div class="course-card">
        <h3>${c.title}</h3>
        <p>${c.description}</p>
        <p><strong>Durée :</strong> ${c.duration}</p>
        <p><strong>Prix :</strong> €${c.price}/mois</p>
      </div>
    `).join('');
  } catch(e){
    console.error('Erreur chargement cours:', e);
  }
}
window.addEventListener('load', loadCourses);
</script>

</body>
</html>
